# PROPOSAL, NOT APPLIED. Blueprint for the staging environment on Render. Nothing here creates resources until a human
# approves it in the Render dashboard (New > Blueprint). Plans marked "paid" incur cost. See docs/staging-deploy.md.
#
# Decisions encoded here:
# - The browser reaches only the frontend (public web service). FastAPI is a private service: no public port.
# - The runtime database login is rckt_app, never the default owner-like user that Render creates. Every secret is
#   sync: false, so its value is entered in the dashboard and never stored in this file.
# - Migrations are NOT run by Render (no preDeployCommand): they run once, by an operator, with DATABASE_MIGRATION_URL.
# - autoDeploy is off: a commit never deploys by itself.
# - Verify the fields against the official Blueprint spec before applying: https://render.com/docs/yaml-spec

services:
  # Public frontend (TanStack Start, Node server). Built from the root Dockerfile.
  - type: web
    name: rckt-campaign-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # paid
    region: frankfurt # decision pending: region of the database must match
    autoDeploy: false
    healthCheckPath: /login
    envVars:
      # Private address of the API, entered manually after the API exists: http://rckt-campaign-api:8000
      # (Render private services are reachable by service name on the private network).
      - key: FASTAPI_INTERNAL_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

  # Private API (FastAPI). No public URL. Reachable only from services in the same Render environment.
  - type: pserv
    name: rckt-campaign-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter # paid
    region: frankfurt
    autoDeploy: false
    envVars:
      # Runtime login rckt_app. Set by hand. Never the database's default user.
      - key: DATABASE_URL
        sync: false
      # Lovable Auth (Supabase-compatible issuer). Verified only with the procedure in docs/staging-deploy.md.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      # Model provider. Staging must not call the paid provider until the owner approves it.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: CHAT_PRIMARY_LLM
        value: google/gemma-3-27b-it
      - key: CHAT_FALLBACK_LLM
        value: openrouter/free
      - key: CHAT_USE_FALLBACK
        value: "true"
      - key: CHAT_TEMPERATURE
        value: "0.2"
      - key: CHAT_TOP_P
        value: "0.8"
      - key: CHAT_MAX_TOKENS
        value: "1200"
      - key: CHAT_TIMEOUT_MS
        value: "45000"
      # Quotas stay off until the owner decides (see docs/PHASE2_AUTH.md).
      - key: ANALYSIS_QUOTA_ENFORCED
        value: "false"

databases:
  # Managed PostgreSQL 16. The creator user is an administrator used only for provisioning the RCKT roles.
  # Verify before applying: the platform user must be allowed to CREATE ROLE, or provision_roles.sql cannot run there.
  - name: rckt-campaign-db
    databaseName: rckt_staging
    postgresMajorVersion: "16"
    plan: basic-256mb # paid
    region: frankfurt
    # Empty list: no connection from outside the Render network. Verify this field's behaviour in the spec.
    ipAllowList: []
