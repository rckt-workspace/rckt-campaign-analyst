name: Docker Compose and FastAPI tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    # Pinned: ubuntu-latest moves to Ubuntu 26 during 2026.
    runs-on: ubuntu-24.04
    # PostgreSQL for the persistence tests. Credentials exist only in this ephemeral CI service.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rckt
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: rckt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rckt -d rckt_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rckt:ci-only-password@127.0.0.1:5432/rckt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run FastAPI and persistence tests
        working-directory: backend
        run: python -m pytest -q -rs tests

  e2e:
    # Browser tests against the built frontend, FastAPI and a simulated OpenRouter.
    # No real provider calls and no credits consumed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: bun run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test env
        run: cp .env.example .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Start services
        run: docker compose up -d --no-build
      - name: Test frontend response
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3000/ -o /dev/null; then exit 0; fi
            sleep 3
          done
          docker compose ps
          docker compose logs --tail=60
          exit 1
      - name: Test backend health internally
        run: docker compose exec -T backend python -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200"
      - name: Shut down
        if: always()
        run: docker compose down
